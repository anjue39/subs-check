name: diy-release

on:
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 动态生成唯一的 Tag (v1.0.序号-日期)
      - name: Auto Tag
        id: create_tag
        run: |
          NEW_TAG="v1.0.${{ github.run_number }}-$(date +'%Y%m%d')"
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # 2. 运行 GoReleaser 生成全平台二进制产物和 Docker 镜像
      - name: Release
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 核心功能：自动清理旧版本，设定保留数量
      - name: Cleanup Old Releases
        uses: dev-drpradheep/delete-older-releases@v0.3.0
        with:
          keep_latest: 5  # <--- 在这里设定你想保留的版本数量
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
