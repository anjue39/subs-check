name: diy-release

on:
  # 纯手动触发
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Tag
        # 修复逻辑：增加 -f 强制覆盖已有标签
        run: |
          git fetch --force --tags
          if [ -z "$(git tag --points-at HEAD)" ]; then
            echo "正在强制更新标签 v0.0.1-latest"
            git config --global user.email "action@github.com"
            git config --global user.name "GitHub Action"
            git tag -f v0.0.1-latest
            git push origin v0.0.1-latest -f
          fi

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Release
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        # 简单高效：只保留最近 5 个 Release，其余删除
        run: |
          gh release list --limit 100 | tail -n +6 | awk '{print $1}' | xargs -I {} gh release delete {} --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
