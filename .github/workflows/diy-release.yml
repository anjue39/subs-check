name: Release

on:
  # 彻底去掉 push 和 tags 触发，仅保留手动触发
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Tag
        run: git fetch --force --tags
        
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: stable
          
      - name: Release
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
