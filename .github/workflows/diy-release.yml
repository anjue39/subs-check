name: diy-release

on:
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Tag
        # 逻辑：不再死守 v0.0.1，每次生成一个唯一的动态标签
        run: |
          git fetch --force --tags
          # 生成一个基于日期和构建号的唯一标签，例如 v1.0.1-20240320
          NEW_TAG="v1.0.${{ github.run_number }}-$(date +'%Y%m%d')"
          echo "正在创建新版本标签: $NEW_TAG"
          
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Release
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        # 核心逻辑：只保留最近 5 个版本，其余的 Release 和 Tag 全部自动物理删除
        run: |
          gh release list --limit 100 | tail -n +6 | awk '{print $1}' | xargs -I {} gh release delete {} --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
