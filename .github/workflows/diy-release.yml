name: diy-release

on:
  workflow_dispatch: 

permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 动态生成唯一的 Tag
      - name: Auto Tag
        id: create_tag
        run: |
          NEW_TAG="v1.0.${{ github.run_number }}-$(date +'%Y%m%d')"
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # 2. 运行 GoReleaser (生成本地二进制版本)
      - name: Release
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 核心修复：使用 GitHub 官方 CLI 只保留最近 5 个 Release 和 Tag
      - name: Cleanup Old Releases
        run: |
          # 获取所有 release 的列表，跳过前 5 个最新的，删除剩下的
          gh release list --limit 100 | tail -n +6 | while read -r line; do
            tag=$(echo "$line" | awk '{print $1}')
            echo "正在删除旧 Release 和 Tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
